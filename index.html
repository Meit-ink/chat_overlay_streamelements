<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="widget.css">
    <script src="widget.js" defer></script>
</head>
<body>
    <!-- <div class="main-container"></div> -->

    <div class="main-container">
        <div data-sender="${data.userId}" data-msgid="${data.msgId}" class="design-case-wrapper message-row {animationIn} animated broadcaster" id="msg-${totalMessages}">
            <div class="user-box ${actionClass}">${badges}Broadcaster</div>
            <div class="design-case">
                <div class="message-case">
                    <div class="user-message ${actionClass}">${message}</div>
                </div>
            </div>
            <div class="tail"></div>
            <div class="tail-shadow"></div>
        </div>

        <div data-sender="${data.userId}" data-msgid="${data.msgId}" class="design-case-wrapper message-row {animationIn} animated viewer" id="msg-${totalMessages}">
            <div class="user-box ${actionClass}">${badges}Viewer</div>
            <div class="design-case">
                <div class="message-case">
                    <div class="user-message ${actionClass}">${message}</div>
                </div>
            </div>
            <div class="tail"></div>
            <div class="tail-shadow"></div>
        </div>

        <div data-sender="${data.userId}" data-msgid="${data.msgId}" class="design-case-wrapper message-row {animationIn} animated moderator" id="msg-${totalMessages}">
            <div class="user-box ${actionClass}">${badges}Moderator</div>
            <div class="design-case">
                <div class="message-case">
                    <div class="user-message ${actionClass}">${message}</div>
                </div>
            </div>
            <div class="tail"></div>
            <div class="tail-shadow"></div>
        </div>
    </div>
</body>
</html>
