    <div class="main-container">
        <div data-sender="${data.userId}" data-msgid="${data.msgId}" class="design-case-wrapper {animationIn} animated ${data.badges[0].type === "broadcaster" ? "broadcaster" : data.badges[0].type === "moderator" ? "moderator" : "viewer"}" id="msg-${totalMessages}">
            <div class="user-box ${actionClass}">${badges}${username}</div>
